name: Deploy Backend to AWS Lambda

on:
  push:
    branches:
      - dev
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"

jobs:
  deploy-lambda:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Package Lambda deployment zip
        working-directory: backend
        run: |
          rm -rf package lambda-deploy.zip
          mkdir -p package
          python -m pip install --upgrade pip
          pip install \
            --platform manylinux2014_x86_64 \
            --implementation cp \
            --python-version 3.12 \
            --only-binary=:all: \
            pydantic==2.9.2 pydantic-core==2.23.4 psycopg-binary==3.2.3 bcrypt==4.0.1 cryptography \
            -t package
          pip install --no-deps --no-cache-dir -r requirements.txt -t package || true
          pip install --no-cache-dir -r requirements.txt -t package --quiet
          cp -r app package/app
          cd package && zip -r ../lambda-deploy.zip . -q

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Deploy to Dev Lambda (dev branch)
        if: github.ref == 'refs/heads/dev'
        run: |
          aws lambda update-function-code \
            --function-name campusconnect-api-dev \
            --zip-file fileb://backend/lambda-deploy.zip

      - name: Deploy to Prod Lambda (main branch)
        if: github.ref == 'refs/heads/main'
        run: |
          aws lambda update-function-code \
            --function-name campusconnect-api \
            --zip-file fileb://backend/lambda-deploy.zip
