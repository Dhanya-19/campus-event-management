name: Deploy Backend to AWS Lambda

on:
  push:
    branches:
      - dev
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"

jobs:
  deploy-lambda:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Inspect Target Lambda Configuration
        id: lambda_cfg
        run: |
          FUNC_NAME=$( [ "${{ github.ref }}" = "refs/heads/main" ] && echo "campusconnect-api" || echo "campusconnect-api-dev" )
          CFG=$(aws lambda get-function-configuration --function-name "$FUNC_NAME" --output json)
          RUNTIME=$(echo "$CFG" | jq -r '.Runtime')
          ARCH=$(echo "$CFG" | jq -r '.Architectures[0]')
          HANDLER=$(echo "$CFG" | jq -r '.Handler')
          echo "Target Function: $FUNC_NAME | Runtime: $RUNTIME | Arch: $ARCH | Handler: $HANDLER"
          PY_VER=$(echo "$RUNTIME" | sed 's/python//')
          PLATFORM=$( [ "$ARCH" = "arm64" ] && echo "manylinux2014_aarch64" || echo "manylinux2014_x86_64" )
          echo "py_ver=$PY_VER" >> $GITHUB_OUTPUT
          echo "platform=$PLATFORM" >> $GITHUB_OUTPUT
          echo "func_name=$FUNC_NAME" >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.lambda_cfg.outputs.py_ver }}

      - name: Package Lambda deployment zip
        working-directory: backend
        run: |
          rm -rf package lambda-deploy.zip
          mkdir -p package
          python -m pip install --upgrade pip
          pip install \
            --platform ${{ steps.lambda_cfg.outputs.platform }} \
            --implementation cp \
            --python-version ${{ steps.lambda_cfg.outputs.py_ver }} \
            --only-binary=:all: \
            --upgrade \
            -r requirements.txt \
            -t package
          cp -r app package/app
          cd package && zip -r ../lambda-deploy.zip . -q

      - name: Deploy to AWS Lambda
        run: |
          aws lambda update-function-code \
            --function-name ${{ steps.lambda_cfg.outputs.func_name }} \
            --zip-file fileb://backend/lambda-deploy.zip
