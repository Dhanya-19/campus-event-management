name: Deploy Frontend to AWS Amplify

on:
  push:
    branches:
      - dev
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"

jobs:
  deploy-amplify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build Dev Frontend
        if: github.ref == 'refs/heads/dev'
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://mcjaddk5eukfkw2lfqhm55axx40imigz.lambda-url.ap-southeast-2.on.aws
        run: |
          rm -f .env.local
          npm ci
          npm run build
          cd dist && zip -r ../frontend-deploy.zip . -q

      - name: Build Prod Frontend
        if: github.ref == 'refs/heads/main'
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://dcod7envqkhwqlky7afv4up6440jeoyq.lambda-url.ap-southeast-2.on.aws
        run: |
          rm -f .env.local
          npm ci
          npm run build
          cd dist && zip -r ../frontend-deploy.zip . -q

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Deploy to AWS Amplify
        run: |
          BRANCH=$( [ "${{ github.ref }}" = "refs/heads/main" ] && echo "staging" || echo "dev" )
          RESPONSE=$(aws amplify create-deployment --app-id d13a8mjnntyy6h --branch-name "$BRANCH" --output json)
          JOB_ID=$(echo "$RESPONSE" | jq -r '.jobId')
          UPLOAD_URL=$(echo "$RESPONSE" | jq -r '.zipUploadUrl')
          curl -s -T frontend/frontend-deploy.zip "$UPLOAD_URL"
          aws amplify start-deployment --app-id d13a8mjnntyy6h --branch-name "$BRANCH" --job-id "$JOB_ID"
